# محسن تيوب على Render (الخطة المجانية).
# - Render بيبني الـDockerfile مع كل تحديث للكود على main.
# - التحديث اللي كل 10 دقايق (data/fresh.jsonl) ما بيعملش بناء جديد: الموقع بيقراه من GitHub على طول،
#   فدقايق البناء المجانية (500 في الشهر) ما بتخلصش. البناء الكامل بيحصل مرة في اليوم (data/last-rebuild.txt).
# - Render ما بيحتفظش بنسخ قديمة متراكمة على حسابك، فمفيش مشكلة تخزين.
services:
  - type: web
    name: mohsen-tube
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /robots.txt
    autoDeploy: true
    buildFilter:
      ignoredPaths:
        - data/fresh.jsonl
        - "**/*.md"
    envVars:
      - key: NEXT_PUBLIC_SITE_URL
        value: https://mohsen-tube.onrender.com
      - key: MOHSEN_LIVE_FRESH
        value: "on"
      - key: YOUTUBE_API_KEY
        sync: false
