# Render Blueprint: free web service for محسن تيوب.
# The SQLite catalog (data/mohsen.db, ~115 MB) is too big for git, so it's committed gzipped
# (data/mohsen.db.gz, ~23 MB) and unpacked during the build.
services:
  - type: web
    name: mohsen-tube
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: gunzip -c data/mohsen.db.gz > data/mohsen.db && npm ci && npm run build
    startCommand: npx next start --port $PORT
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NEXT_PUBLIC_SUPABASE_URL
        value: https://psrqpjzovpnrrsaulahc.supabase.co
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        value: sb_publishable_4aHNMaBF1FNmBfVq6HhtsQ_2dD9a_bx
