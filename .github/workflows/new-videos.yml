# كل ساعة: يسحب الفيديوهات اللي نزلت على يوتيوب من قنوات الموقع ويضيفها لـ data/fresh.jsonl.
# لو فيه جديد بيعمل commit، فـ Vercel بينشر الموقع تلقائي وتظهر الفيديوهات خلال دقايق.
name: New videos

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: new-videos
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Open the catalog
        run: gunzip -c data/mohsen.db.gz > data/mohsen.db

      - name: Fetch new uploads
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node --experimental-strip-types scripts/sync-new.ts

      - name: Publish if anything new
        run: |
          git add data/fresh.jsonl 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "مفيش جديد"
            exit 0
          fi
          git config user.name "Mohsen Tube Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "New videos from YouTube ($(date -u +%Y-%m-%d\ %H:%M) UTC)"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 10; done
          exit 1
