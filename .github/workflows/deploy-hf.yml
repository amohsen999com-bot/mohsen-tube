# نشر الموقع على Hugging Face Spaces (مجاني).
# - بيشتغل مع كل تحديث للكود على main، ومرة في اليوم (بعد السحب اليومي) عشان الفيديوهات الجديدة تدخل البحث.
# - بعد كل رفع بيمسح كل النسخ القديمة من Hugging Face (super_squash_history)، فالمساحة عمرها ما تتراكم:
#   اللي متخزن هناك دايمًا هو آخر نسخة بس.
# محتاج سر واحد في GitHub: HF_TOKEN (توكن Hugging Face بصلاحية write).
name: Deploy to Hugging Face

on:
  push:
    branches: [main]
    paths-ignore:
      - "data/fresh.jsonl"
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

concurrency:
  group: deploy-hf
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upload to the Space (latest version only)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SPACE_NAME: mohsen-tube
        run: |
          pip install --quiet "huggingface_hub>=0.30"
          python - <<'PY'
          import os, re, shutil, subprocess, pathlib
          from huggingface_hub import HfApi

          api = HfApi(token=os.environ["HF_TOKEN"])
          user = api.whoami()["name"]
          repo = f"{user}/{os.environ['SPACE_NAME']}"
          host = re.sub(r"[^a-z0-9-]", "-", f"{user}-{os.environ['SPACE_NAME']}".lower())
          site = f"https://{host}.hf.space"
          api.create_repo(repo, repo_type="space", space_sdk="docker", exist_ok=True)

          # The Space gets the repo as it is, minus git and local-only files, plus its own README header
          stage = pathlib.Path("/tmp/space")
          shutil.rmtree(stage, ignore_errors=True)
          subprocess.run(["rsync", "-a", "--exclude=.git", "--exclude=node_modules", "--exclude=.next",
                          "--exclude=data/*.db", "--exclude=data/*.db-*", "./", f"{stage}/"], check=True)
          (stage / "README.md").write_text(
              "---\ntitle: Mohsen Tube\nemoji: ▶️\ncolorFrom: red\ncolorTo: yellow\nsdk: docker\napp_port: 7860\npinned: false\n---\n\n"
              "محسن تيوب — بيتنشر تلقائيًا من GitHub.\n", encoding="utf-8")
          df = stage / "Dockerfile"
          df.write_text(df.read_text(encoding="utf-8").replace("__SITE_URL__", site), encoding="utf-8")

          api.upload_folder(folder_path=str(stage), repo_id=repo, repo_type="space",
                            delete_patterns="*", commit_message=f"Deploy {os.environ.get('GITHUB_SHA', '')[:7]}")
          # Keep only the latest version on Hugging Face: old copies of the database never pile up
          api.super_squash_history(repo_id=repo, repo_type="space")
          print("Deployed:", site)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write(f"Site: {site}\n")
          PY
